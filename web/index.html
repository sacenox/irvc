<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applied before first paint: mode, palette and the user's color
      // overrides, plus their font-size preference.
      (function () {
        var prefs = null;
        try {
          prefs = JSON.parse(localStorage.getItem("irvc.theme"));
        } catch (e) {
          var legacy = localStorage.getItem("irvc.theme");
          if (legacy === "light" || legacy === "dark") prefs = { mode: legacy };
          else if (legacy === "tuxedo" || legacy === "nicotine") prefs = { preset: legacy };
        }
        if (!prefs || typeof prefs !== "object") {
          prefs = { mode: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light" };
        }
        var el = document.documentElement;
        el.classList.toggle("dark", prefs.mode === "dark");
        el.dataset.preset = prefs.preset === "tuxedo" ? "tuxedo" : "nicotine";
        var over = (prefs.overrides && prefs.overrides[prefs.mode]) || {};
        for (var t in over) {
          el.style.setProperty(
            "--" + t.replace(/[A-Z]/g, function (c) {
              return "-" + c.toLowerCase();
            }),
            over[t],
          );
        }
        try {
          var s = JSON.parse(localStorage.getItem("irvc.settings")) || {};
          el.style.fontSize = { default: "", normal: "16px", large: "18px" }[s.fontSize] || "16px";
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0806'/><circle cx='16' cy='16' r='5' fill='%23ffcc55'/></svg>"
    />
    <title>irvc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
